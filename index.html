<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Petors AS — Utstyrsregister</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --surface: #141720;
    --surface2: #1c2030;
    --border: #252b3d;
    --accent: #e8ff47;
    --accent2: #47b8ff;
    --text: #e8eaf0;
    --muted: #6b7290;
    --danger: #ff5c5c;
    --ok: #4dff9e;
    --service: #ffb347;
    --utgatt: #ff5c5c;

    --cat-sub: #a78bfa;
    --cat-topper: #60a5fa;
    --cat-monitor: #34d399;
    --cat-lydmixer: #f472b6;
    --cat-lysmixer: #fbbf24;
    --cat-stagerack: #fb923c;
    --cat-mikrofon: #38bdf8;
    --cat-di: #a3e635;
    --cat-stativ: #e879f9;
    --cat-default: #94a3b8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
  }

  /* HEADER */
  header {
    border-bottom: 1px solid var(--border);
    padding: 28px 40px 24px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 20px;
  }

  .logo-block svg.site-logo {
    height: 50px;
    width: auto;
    display: block;
  }
  .logo-block p {
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-top: 6px;
  }

  .header-stats {
    display: flex;
    gap: 32px;
  }
  .stat {
    text-align: right;
  }
  .stat-num {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 1.6rem;
    color: var(--accent);
    line-height: 1;
  }
  .stat-label {
    font-size: 0.68rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-top: 2px;
  }

  /* TOOLBAR */
  .toolbar {
    padding: 20px 40px;
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 200px;
  }
  .search-wrap svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    opacity: 0.4;
  }
  input[type="text"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 0.85rem;
    padding: 10px 14px 10px 40px;
    border-radius: 6px;
    outline: none;
    transition: border-color 0.15s;
  }
  input[type="text"]:focus { border-color: var(--accent); }

  select {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 0.82rem;
    padding: 10px 14px;
    border-radius: 6px;
    outline: none;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  select:focus { border-color: var(--accent); }

  .btn {
    font-family: 'Syne', sans-serif;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 10px 18px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-accent {
    background: var(--accent);
    color: #0d0f14;
  }
  .btn-accent:hover { background: #d4eb2c; }
  .btn-ghost {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

  /* TABLE */
  .table-wrap {
    padding: 28px 40px;
    overflow-x: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.83rem;
  }

  thead th {
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    text-align: left;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
  }
  thead th:hover { color: var(--accent); }
  thead th.sort-asc::after { content: ' ↑'; color: var(--accent); }
  thead th.sort-desc::after { content: ' ↓'; color: var(--accent); }

  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
    cursor: pointer;
  }
  tbody tr:hover { background: var(--surface); }

  td {
    padding: 12px 14px;
    vertical-align: middle;
  }

  .cat-badge {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 100px;
    font-size: 0.7rem;
    font-weight: 500;
    letter-spacing: 0.05em;
    border: 1px solid;
  }

  .status-dot {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.75rem;
  }
  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .dot-ok { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  .dot-service { background: var(--service); box-shadow: 0 0 6px var(--service); }
  .dot-utgatt { background: var(--utgatt); box-shadow: 0 0 6px var(--utgatt); }

  .qty-badge {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--accent2);
  }

  .no-results {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-size: 0.85rem;
  }

  /* MODAL */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    width: 560px;
    max-width: 95vw;
    max-height: 90vh;
    overflow-y: auto;
    transform: translateY(16px);
    transition: transform 0.2s;
  }
  .modal-overlay.open .modal { transform: translateY(0); }

  .modal-header {
    padding: 24px 28px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .modal-header h2 {
    font-family: 'Syne', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
  }
  .modal-close {
    background: none; border: none; color: var(--muted);
    font-size: 1.4rem; cursor: pointer; line-height: 1;
    transition: color 0.15s;
  }
  .modal-close:hover { color: var(--text); }

  .modal-body { padding: 24px 28px; }

  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .form-full { grid-column: 1 / -1; }

  .form-group label {
    display: block;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .form-group input,
  .form-group select,
  .form-group textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 0.85rem;
    padding: 10px 12px;
    border-radius: 6px;
    outline: none;
    transition: border-color 0.15s;
    resize: vertical;
  }
  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus { border-color: var(--accent); }

  .modal-footer {
    padding: 16px 28px 24px;
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    border-top: 1px solid var(--border);
  }

  .btn-danger {
    background: transparent;
    border: 1px solid var(--danger);
    color: var(--danger);
    margin-right: auto;
  }
  .btn-danger:hover { background: var(--danger); color: #fff; }

  /* EMPTY */
  .empty-state {
    text-align: center;
    padding: 80px 20px;
    color: var(--muted);
  }
  .empty-state h3 {
    font-family: 'Syne', sans-serif;
    font-size: 1.1rem;
    margin-bottom: 8px;
    color: var(--text);
  }

  @media (max-width: 700px) {
    header { flex-direction: column; align-items: flex-start; padding: 20px; }
    .header-stats { gap: 20px; }
    .toolbar { padding: 16px 20px; }
    .table-wrap { padding: 16px 20px; }
    .form-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="logo-block">
    <svg class="site-logo" viewBox="0 0 390 66" xmlns="http://www.w3.org/2000/svg">
  <style>
    .lt { font-family: 'Trebuchet MS', Arial, sans-serif; font-size: 58px; font-weight: 300; fill: #b8bcc8; }
  </style>
  <text class="lt" x="0" y="54">Pet</text>
  <circle cx="107" cy="38" r="18" fill="none" stroke="#b8bcc8" stroke-width="2.8"/>
  <circle cx="107" cy="38" r="6" fill="#9aa0b8"/>
  <text class="lt" x="128" y="54">rs as</text>
</svg>
    <p>Utstyrsregister — Lydanlegg</p>
  </div>
  <div class="header-stats">
    <div class="stat">
      <div class="stat-num" id="stat-total">0</div>
      <div class="stat-label">Enheter totalt</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="stat-items">0</div>
      <div class="stat-label">Produktlinjer</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="stat-service" style="color:var(--service)">0</div>
      <div class="stat-label">Til service</div>
    </div>
  </div>
</header>

<div class="toolbar">
  <div class="search-wrap">
    <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" color="#fff"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="search" placeholder="Søk etter vare, kategori, lokasjon...">
  </div>
  <select id="filter-kat">
    <option value="">Alle kategorier</option>
  </select>
  <select id="filter-lok">
    <option value="">Alle lokasjoner</option>
  </select>
  <select id="filter-status">
    <option value="">Alle statuser</option>
    <option value="OK">OK</option>
    <option value="Service">Service</option>
    <option value="Utgått">Utgått</option>
  </select>
  <button class="btn btn-accent" onclick="openModal(null)">+ Legg til</button>
  <button class="btn btn-ghost" onclick="exportCSV()">Eksport CSV</button>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th onclick="sortBy('kategori')">Kategori</th>
        <th onclick="sortBy('vare')">Vare / Modell</th>
        <th onclick="sortBy('kvantitet')">Ant.</th>
        <th onclick="sortBy('lokasjon')">Lokasjon</th>
        <th onclick="sortBy('status')">Status</th>
        <th onclick="sortBy('serienummer')">Serienr.</th>
        <th onclick="sortBy('innkjopspris')">Pris (NOK)</th>
        <th onclick="sortBy('innkjopsdato')">Dato</th>
        <th>Kommentar</th>
      </tr>
    </thead>
    <tbody id="table-body"></tbody>
  </table>
  <div id="no-results" class="no-results" style="display:none">Ingen resultater matcher filteret.</div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModalIfBg(event)">
  <div class="modal" id="modal">
    <div class="modal-header">
      <h2 id="modal-title">Legg til utstyr</h2>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-group">
          <label>Kategori *</label>
          <select id="f-kategori">
            <option>Sub</option>
            <option>Topper</option>
            <option>Monitor</option>
            <option>Lydmixer</option>
            <option>Lysmixer</option>
            <option>Stagerack</option>
            <option>Mikrofon</option>
            <option>DI</option>
            <option>Stativ - gitar</option>
            <option>Annet</option>
          </select>
        </div>
        <div class="form-group">
          <label>Status *</label>
          <select id="f-status">
            <option>OK</option>
            <option>Service</option>
            <option>Utgått</option>
          </select>
        </div>
        <div class="form-group form-full">
          <label>Vare / Modell *</label>
          <input type="text" id="f-vare" placeholder="f.eks. Shure SM58">
        </div>
        <div class="form-group">
          <label>Kvantitet *</label>
          <input type="number" id="f-kvantitet" min="1" value="1">
        </div>
        <div class="form-group">
          <label>Lokasjon</label>
          <input type="text" id="f-lokasjon" placeholder="f.eks. Selbu">
        </div>
        <div class="form-group">
          <label>Serienummer / Asset-ID</label>
          <input type="text" id="f-serienummer" placeholder="f.eks. SN-2024-001">
        </div>
        <div class="form-group">
          <label>Innkjøpspris (NOK)</label>
          <input type="number" id="f-pris" min="0" placeholder="0">
        </div>
        <div class="form-group">
          <label>Innkjøpsdato</label>
          <input type="date" id="f-dato">
        </div>
        <div class="form-group form-full">
          <label>Kommentar</label>
          <textarea id="f-kommentar" rows="2" placeholder="Ekstra informasjon..."></textarea>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-danger" id="btn-delete" onclick="deleteItem()" style="display:none">Slett</button>
      <button class="btn btn-ghost" onclick="closeModal()">Avbryt</button>
      <button class="btn btn-accent" onclick="saveItem()">Lagre</button>
    </div>
  </div>
</div>

  {kategori:'Stativ - gitar',vare:'Proel El/akk',kvantitet:1,lokasjon:'Selbu',kommentar:'Samlekassen',status:'OK',serienummer:'',innkjopspris:'',innkjopsdato:''},
  {kategori:'Stativ - gitar',vare:'Rockline Elgitar',kvantitet:1,lokasjon:'Selbu',kommentar:'Samlekassen',status:'OK',serienummer:'',innkjopspris:'',innkjopsdato:''},
  {kategori:'Stativ - gitar',vare:'Supreme Akk',kvantitet:1,lokasjon:'Selbu',kommentar:'Samlekassen',status:'OK',serienummer:'',innkjopspris:'',innkjopsdato:''},
];

let db = JSON.parse(localStorage.getItem('petors_db') || 'null') || INITIAL_DATA.map((r,i)=>({...r,id:i}));
let nextId = Math.max(...db.map(r=>r.id), 0) + 1;
let sortCol = 'kategori', sortDir = 1;
let editId = null;

function save() { localStorage.setItem('petors_db', JSON.stringify(db)); }

function getFiltered() {
  const q = document.getElementById('search').value.toLowerCase();
  const kat = document.getElementById('filter-kat').value;
  const lok = document.getElementById('filter-lok').value;
  const st = document.getElementById('filter-status').value;
  return db.filter(r => {
    const match = !q || [r.vare,r.kategori,r.lokasjon,r.kommentar,r.serienummer].some(v=>(v||'').toLowerCase().includes(q));
    return match && (!kat || r.kategori===kat) && (!lok || r.lokasjon===lok) && (!st || r.status===st);
  }).sort((a,b) => {
    const av = a[sortCol]??'', bv = b[sortCol]??'';
    return (av < bv ? -1 : av > bv ? 1 : 0) * sortDir;
  });
}

function catColor(cat) { return CAT_COLORS[cat] || CAT_COLORS['Annet']; }

function statusDot(s) {
  const cls = s==='OK'?'dot-ok':s==='Service'?'dot-service':'dot-utgatt';
  return `<span class="status-dot"><span class="dot ${cls}"></span>${s}</span>`;
}

function render() {
  const rows = getFiltered();
  const tbody = document.getElementById('table-body');
  const noR = document.getElementById('no-results');
  if (!rows.length) { tbody.innerHTML=''; noR.style.display='block'; }
  else {
    noR.style.display='none';
    tbody.innerHTML = rows.map(r => `
      <tr onclick="openModal(${r.id})">
        <td><span class="cat-badge" style="color:${catColor(r.kategori)};border-color:${catColor(r.kategori)}22;background:${catColor(r.kategori)}11">${r.kategori}</span></td>
        <td>${r.vare||'—'}</td>
        <td><span class="qty-badge">${r.kvantitet}</span></td>
        <td>${r.lokasjon||'—'}</td>
        <td>${statusDot(r.status)}</td>
        <td style="color:var(--muted);font-size:0.78rem">${r.serienummer||'—'}</td>
        <td style="color:var(--muted);font-size:0.78rem">${r.innkjopspris?Number(r.innkjopspris).toLocaleString('nb-NO'):'—'}</td>
        <td style="color:var(--muted);font-size:0.78rem">${r.innkjopsdato||'—'}</td>
        <td style="color:var(--muted);font-size:0.78rem;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.kommentar||''}</td>
      </tr>`).join('');
  }
  // stats
  const total = db.reduce((s,r)=>s+(parseInt(r.kvantitet)||0),0);
  const serviceCount = db.filter(r=>r.status==='Service').length;
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-items').textContent = db.length;
  document.getElementById('stat-service').textContent = serviceCount;
  // filters
  populateFilters();
}

function populateFilters() {
  const kats = [...new Set(db.map(r=>r.kategori).filter(Boolean))].sort();
  const loks = [...new Set(db.map(r=>r.lokasjon).filter(Boolean))].sort();
  const fk = document.getElementById('filter-kat');
  const fl = document.getElementById('filter-lok');
  const ck = fk.value, cl = fl.value;
  fk.innerHTML = '<option value="">Alle kategorier</option>' + kats.map(k=>`<option value="${k}">${k}</option>`).join('');
  fl.innerHTML = '<option value="">Alle lokasjoner</option>' + loks.map(l=>`<option value="${l}">${l}</option>`).join('');
  fk.value = ck; fl.value = cl;
}

function sortBy(col) {
  if(sortCol===col) sortDir*=-1; else { sortCol=col; sortDir=1; }
  document.querySelectorAll('thead th').forEach(th=>th.classList.remove('sort-asc','sort-desc'));
  const idx = ['kategori','vare','kvantitet','lokasjon','status','serienummer','innkjopspris','innkjopsdato'].indexOf(col);
  const ths = document.querySelectorAll('thead th');
  if(idx>=0) ths[idx].classList.add(sortDir===1?'sort-asc':'sort-desc');
  render();
}

function openModal(id) {
  editId = id;
  const m = document.getElementById('modal-overlay');
  const del = document.getElementById('btn-delete');
  document.getElementById('modal-title').textContent = id===null ? 'Legg til utstyr' : 'Rediger utstyr';
  del.style.display = id===null ? 'none' : 'inline-block';
  if(id !== null) {
    const r = db.find(x=>x.id===id);
    if(r) {
      document.getElementById('f-kategori').value = r.kategori||'Sub';
      document.getElementById('f-vare').value = r.vare||'';
      document.getElementById('f-kvantitet').value = r.kvantitet||1;
      document.getElementById('f-lokasjon').value = r.lokasjon||'';
      document.getElementById('f-kommentar').value = r.kommentar||'';
      document.getElementById('f-status').value = r.status||'OK';
      document.getElementById('f-serienummer').value = r.serienummer||'';
      document.getElementById('f-pris').value = r.innkjopspris||'';
      document.getElementById('f-dato').value = r.innkjopsdato||'';
    }
  } else {
    document.getElementById('f-kategori').value = 'Sub';
    document.getElementById('f-vare').value = '';
    document.getElementById('f-kvantitet').value = 1;
    document.getElementById('f-lokasjon').value = '';
    document.getElementById('f-kommentar').value = '';
    document.getElementById('f-status').value = 'OK';
    document.getElementById('f-serienummer').value = '';
    document.getElementById('f-pris').value = '';
    document.getElementById('f-dato').value = '';
  }
  m.classList.add('open');
}

function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }
function closeModalIfBg(e) { if(e.target.id==='modal-overlay') closeModal(); }

function saveItem() {
  const vare = document.getElementById('f-vare').value.trim();
  if(!vare) { alert('Vare/modell er påkrevd.'); return; }
  const item = {
    id: editId !== null ? editId : nextId++,
    kategori: document.getElementById('f-kategori').value,
    vare,
    kvantitet: parseInt(document.getElementById('f-kvantitet').value)||1,
    lokasjon: document.getElementById('f-lokasjon').value.trim(),
    kommentar: document.getElementById('f-kommentar').value.trim(),
    status: document.getElementById('f-status').value,
    serienummer: document.getElementById('f-serienummer').value.trim(),
    innkjopspris: document.getElementById('f-pris').value,
    innkjopsdato: document.getElementById('f-dato').value,
  };
  if(editId !== null) db = db.map(r=>r.id===editId?item:r);
  else db.push(item);
  save(); closeModal(); render();
}

function deleteItem() {
  if(!confirm('Slett dette utstyret?')) return;
  db = db.filter(r=>r.id!==editId);
  save(); closeModal(); render();
}

function exportCSV() {
  const rows = getFiltered();
  const headers = ['Kategori','Vare','Kvantitet','Lokasjon','Status','Serienummer','Innkjøpspris','Innkjøpsdato','Kommentar'];
  const lines = [headers.join(';'), ...rows.map(r=>[r.kategori,r.vare,r.kvantitet,r.lokasjon,r.status,r.serienummer,r.innkjopspris,r.innkjopsdato,r.kommentar].map(v=>`"${(v||'').toString().replace(/"/g,'""')}"`).join(';'))];
  const blob = new Blob(['\uFEFF'+lines.join('\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'Petors_Anlegg.csv'; a.click();
}

['search','filter-kat','filter-lok','filter-status'].forEach(id=>
  document.getElementById(id).addEventListener('input', render)
);

render();
</script>
</body>
</html>
